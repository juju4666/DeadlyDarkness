// Begotten line actions that exist only for Hexen-format maps (UDMF maps can use Music_ChangeSong 2703 directly).
// The song number is looked up in the BGMUSIC lump: one "<number> <LUMPNAME>" per line.

begotten
{
  title = "Begotten";

  212
  {
    title = "Music Change";
    id = "Begotten_MusicChange";
    requiresactivation = true;
    prefix = "";

    arg0
    {
      title = "Song Number (BGMUSIC lump)";
      type = 0;
    }

    arg1
    {
      title = "Only Activator Hears It";
      type = 11;
      enum
      {
        0 = "No (everyone)";
        1 = "Yes (crossing player only)";
      }
    }

    arg2
    {
      title = "Loop";
      type = 11;
      enum
      {
        0 = "Loop";
        1 = "Play once";
      }
    }
  }

  213
  {
    title = "Music Stop";
    id = "Begotten_MusicStop";
    requiresactivation = true;
    prefix = "";

    arg0
    {
      title = "Only Activator Hears It";
      type = 11;
      enum
      {
        0 = "No (everyone)";
        1 = "Yes (crossing player only)";
      }
    }
  }
  174
  {
    title = "Checkpoint (set activation: Player walks over)";
    id = "Begotten_Checkpoint";
    requiresactivation = true;
    prefix = "";
  }

  300
  {
    title = "Grind Rail (swordsman only)";
    id = "Begotten_GrindRail";
    requiresactivation = false;
    prefix = "";

    arg0
    {
      title = "Height Above Floor (0 = 24)";
      type = 0;
    }

    arg1
    {
      title = "Grind Speed (0 = 26, max 29)";
      type = 0;
    }
  }

  // ACS: the script actions of the Hexen map format (the same numbers as in Hexen and ZDoom)
  80
  {
    title = "ACS Execute";
    id = "ACS_Execute";
    requiresactivation = true;
    prefix = "";

    arg0
    {
      title = "Script Number";
      type = 0;
    }

    arg1
    {
      title = "Map Number (0 = this map)";
      type = 0;
    }

    arg2
    {
      title = "Script Argument 1";
      type = 0;
    }

    arg3
    {
      title = "Script Argument 2";
      type = 0;
    }

    arg4
    {
      title = "Script Argument 3";
      type = 0;
    }
  }

  81
  {
    title = "ACS Suspend";
    id = "ACS_Suspend";
    requiresactivation = true;
    prefix = "";

    arg0
    {
      title = "Script Number";
      type = 0;
    }

    arg1
    {
      title = "Map Number (0 = this map)";
      type = 0;
    }
  }

  82
  {
    title = "ACS Terminate";
    id = "ACS_Terminate";
    requiresactivation = true;
    prefix = "";

    arg0
    {
      title = "Script Number";
      type = 0;
    }

    arg1
    {
      title = "Map Number (0 = this map)";
      type = 0;
    }
  }

  83
  {
    title = "ACS Locked Execute";
    id = "ACS_LockedExecute";
    requiresactivation = true;
    prefix = "";

    arg0
    {
      title = "Script Number";
      type = 0;
    }

    arg1
    {
      title = "Map Number (0 = this map)";
      type = 0;
    }

    arg2
    {
      title = "Script Argument 1";
      type = 0;
    }

    arg3
    {
      title = "Key Number (0 = any)";
      type = 0;
    }

    arg4
    {
