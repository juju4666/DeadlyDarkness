  64 = "Class 2 (Witch)";
  128 = "Class 3 (Swordsman)";
  256 = "Singleplayer";
  512 = "Cooperative";
  1024 = "Deathmatch";
}

// How to compare thing flags (for the stuck things error checker)
thingflagscompare
{
  skills
  {
    1;
    2;
    4;
  }

  classes
  {
    32;
    64;
    128;
  }

  gamemodes
  {
    256 { requiredgroups = "skills,classes"; }
    512 { requiredgroups = "skills,classes"; }
    1024 { ignoredgroups = "skills"; requiredgroups = "classes"; }
  }
}

