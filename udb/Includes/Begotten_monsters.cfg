// sprites; only 21001 (rocket trooper) and 21016 (articulator heart) are new numbers.  Stats live in the
// BGMOBJ lump and prboom2/src/dsda/bgroster.c, not here.  Include it AFTER Doom_things.cfg.  Faction colours: Modern = blue, Medieval =
// brown, Alien = green, bosses = red.
