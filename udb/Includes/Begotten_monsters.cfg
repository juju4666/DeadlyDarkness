// Begotten: the monster roster.  The new monsters took over Doom's monster slots (same numbers: 3002 is now the
// werewolf, 68 the shock trooper ...).  UDB keeps the FIRST definition of a number, which is Doom's own, so these
// are written into Doom's own "monsters" category (a later definition of the same number there replaces Doom's one),
// with the new name and the new monster's own sprite and size.  Only 21001 (rocket trooper) and 21016 (articulator
// heart) are new numbers and get categories of their own.  Stats live in the BGMOBJ lump and
// prboom2/src/dsda/bgroster.c, not here.  Include it AFTER Doom_things.cfg and Doom2_things.cfg.
// Factions: [Modern], [Medieval], [Alien], [Boss].
monsters
{
  // Modern
  68 { title = "Shock trooper [Modern] (was Arachnotron)"; sprite = "STRPA1"; width = 20; height = 56; hangs = 0; blocking = 2; }

  // Medieval
  3002 { title = "Werewolf [Medieval] (was Demon)";               sprite = "WWLFA1"; width = 30; height = 56; hangs = 0; blocking = 2; }
  3001 { title = "Fire elemental [Medieval] (was Imp)";           sprite = "FELMA1"; width = 20; height = 56; hangs = 0; blocking = 2; }
  66   { title = "Mad wizard [Medieval] (was Revenant)";          sprite = "MWIZA1"; width = 20; height = 56; hangs = 0; blocking = 2; }
  69   { title = "Apprentice [Medieval] (was Hell Knight)";       sprite = "APPRA1"; width = 24; height = 64; hangs = 0; blocking = 2; }
  3003 { title = "Minister [Medieval] (levitating; was Baron)";   sprite = "MINIA1"; width = 24; height = 64; hangs = 1; blocking = 2; }
  67   { title = "Golem [Medieval] (was Mancubus)";               sprite = "GLEMA1"; width = 36; height = 72; hangs = 0; blocking = 2; }

  // Alien
  64   { title = "Mindeater [Alien] (was Arch-vile; no resurrection)"; sprite = "MNDEA1"; width = 20; height = 56; hangs = 0; blocking = 2; }
  58   { title = "Aegis [Alien] (raises the dead, once; was Spectre)";  sprite = "AEGSA1"; width = 14; height = 28; hangs = 1; blocking = 2; }
  3005 { title = "Bore [Alien] (was Cacodemon)";                       sprite = "BOREA1"; width = 26; height = 44; hangs = 1; blocking = 2; }
  71   { title = "Conjurer [Alien] (summons Hatreds / Aegises; was Pain Elemental)"; sprite = "CNJRA1"; width = 31; height = 56; hangs = 1; blocking = 2; }
  3006 { title = "Hatred [Alien] (charges, may explode; was Lost Soul)"; sprite = "HTRDA1"; width = 14; height = 40; hangs = 1; blocking = 2; }

  // Bosses (any monster with Tag 30000-30999 is a boss too)
  16   { title = "Mecha [Boss] (rockets, heat-seekers, flames; was Cyberdemon)"; sprite = "MECHA1"; width = 40; height = 110; hangs = 0; blocking = 2; }
  7    { title = "Giant beetle [Boss] (kill all four; was Spider Mastermind)";   sprite = "BEETA1"; width = 80; height = 90; hangs = 0; blocking = 2; }
  88   { title = "Articulator core [Boss] (main heart; was Boss Brain)";         sprite = "COREA0"; width = 32; height = 72; hangs = 0; blocking = 2; }
}

